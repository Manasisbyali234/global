  <script>
    // Force light mode immediately - iOS Safari compatible
    (function() {
      if (window.matchMedia) {
        var originalMatchMedia = window.matchMedia;
        window.matchMedia = function(query) {
          if (query.includes('prefers-color-scheme: dark')) {
            return { matches: false, media: query, onchange: null, addListener: function() {}, removeListener: function() {}, addEventListener: function() {}, removeEventListener: function() {}, dispatchEvent: function() { return true; } };
          }
          return originalMatchMedia.call(this, query);
        };
      }
      setTimeout(function() {
        if (document.documentElement) document.documentElement.classList.add('light-mode-forced');
      }, 100);
      document.addEventListener('DOMContentLoaded', function() {
        var inputs = document.querySelectorAll('input, select, textarea');
        inputs.forEach(function(input) {
          input.addEventListener('focus', function() {
            if (window.innerWidth < 768) {
              document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
            }
          });
          input.addEventListener('blur', function() {
            document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no');
