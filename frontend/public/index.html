    // Configure Tailwind: disable preflight to prevent base resets clashing with existing CSS

    // Force light mode immediately - iOS Safari compatible
    (function() {
      // Override matchMedia to always return false for dark mode
      if (window.matchMedia) {
        const originalMatchMedia = window.matchMedia;
        window.matchMedia = function(query) {
          if (query.includes('prefers-color-scheme: dark')) {
            return {
              matches: false,
              media: query,
              onchange: null,
              addListener: function() {},
              removeListener: function() {},
              addEventListener: function() {},
              removeEventListener: function() {},
              dispatchEvent: function() { return true; }
            };
          }
          return originalMatchMedia.call(this, query);
        };
      }
      
      // Add class to enable transitions after forcing light mode
      setTimeout(() => {
        if (document.documentElement) {
          document.documentElement.classList.add('light-mode-forced');
        }
      }, 100);
      
      // iOS Safari specific fixes
      document.addEventListener('DOMContentLoaded', function() {
        // Prevent iOS Safari zoom on input focus
        const inputs = document.querySelectorAll('input, select, textarea');
        inputs.forEach(input => {
          input.addEventListener('focus', function() {
            if (window.innerWidth < 768) {
              document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
            }
          });
          input.addEventListener('blur', function() {
            document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no');
          });
        });
      });
    })();
  </script>
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) {
        return;
      }

      const cleanupKey = 'taleglobal-sw-cleanup-v1';

      const runServiceWorkerCleanup = async function () {
        try {
          if (window.localStorage && localStorage.getItem(cleanupKey) === 'done') {
            return;
          }
        } catch (storageError) {
          // Ignore storage access issues and continue with cleanup.
        }

        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));

          if ('caches' in window) {
            const cacheKeys = await caches.keys();
            await Promise.all(cacheKeys.map((cacheKey) => caches.delete(cacheKey)));
          }

          if (window.localStorage) {
            localStorage.setItem(cleanupKey, 'done');
          }
        } catch (cleanupError) {
          console.warn('Service worker cleanup skipped:', cleanupError);
        }
      };

      window.addEventListener('load', runServiceWorkerCleanup);
    })();
  </script>

      var dashboardPaths = ['/employer', '/candidate', '/admin', '/placement', '/sub-admin'];

      if (!isDashboard) return;
      var scripts = [
        '%PUBLIC_URL%/assets/js/bootstrap-select.min.js',
        '%PUBLIC_URL%/assets/js/jquery.dataTables.min.js',
        '%PUBLIC_URL%/assets/js/dataTables.bootstrap5.min.js'
      ];
      function loadNext(i) {
        if (i >= scripts.length) return;
        var s = document.createElement('script');
        s.src = scripts[i];
        s.onload = function() { loadNext(i + 1); };
        document.body.appendChild(s);
      }
      window.addEventListener('load', function() { loadNext(0); });
    })();
  </script>
