server {
    if ($host = www.taleglobal.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = taleglobal.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name taleglobal.net www.taleglobal.net;

    return 301 https://taleglobal.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name taleglobal.net www.taleglobal.net;

    ssl_certificate /etc/letsencrypt/live/taleglobal.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/taleglobal.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/global/frontend/build;
    index index.html;

    client_max_body_size 50M;

    # ── Gzip compression ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml font/woff2 font/ttf font/eot;

    # ── Never cache index.html ────────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # ── React hashed chunks: 1 year immutable ────────────────────────────
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
    }

    # ── Public assets (JS, CSS, images, fonts): 1 year immutable ─────────
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
    }

    # ── Root-level fix CSS/JS files: 1 year immutable ────────────────────
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
    }

    # ── Fonts and images: 1 year immutable ───────────────────────────────
    location ~* \.(woff|woff2|ttf|eot|otf|gif|webp|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── API -> Node backend ───────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Uploaded files -> Node backend ───────────────────────────────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Socket.IO ─────────────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── React SPA fallback ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
